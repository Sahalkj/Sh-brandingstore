<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>SH Branding Store | Fine Jewellery &amp; Clothing</title>
<meta name="description" content="SH Branding Store – fine jewellery and luxury clothing, in Abu Dhabi, UAE. Cash on delivery available across the Emirates.">
<link rel="icon" href="images/logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Italiana&family=Tenor+Sans&family=Beau+Rivage&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#4a3b2a; --ink-2:#5a4936;
  --sand:#f8f1e6; --sand-2:#efe3d2;
  --gold:#b89a70; --gold-soft:#d8c3a3; --gold-deep:#927653;
  --taupe:#8a7761;
  --text-on-sand:#4b3d2e; --text-on-ink:#f8f1e6; --muted-on-ink:#8d7b67;
  --field-bg:rgba(255,255,255,.65); --line:rgba(138,119,97,.28); --err:#a3372c;
  --serif:"Italiana","Cormorant Garamond","Didot","Bodoni MT",Georgia,serif;
  --sans:"Tenor Sans","Gill Sans","Helvetica Neue",Arial,sans-serif;
  --script:"Beau Rivage","Segoe Script","Brush Script MT",cursive;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
  --nav-h:76px;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){--sand:#f8f1e6;--sand-2:#efe3d2;--text-on-sand:#4b3d2e;--taupe:#8a7761;--field-bg:rgba(255,255,255,.65);--line:rgba(138,119,97,.28);--err:#a3372c}
}
:root[data-theme="dark"]{--sand:#f8f1e6;--sand-2:#efe3d2;--text-on-sand:#4b3d2e;--taupe:#8a7761;--field-bg:rgba(255,255,255,.65);--line:rgba(138,119,97,.28);--err:#a3372c}

*,*::before,*::after{box-sizing:inherit}
html{height:100%;scroll-padding-top:calc(var(--nav-h) + env(safe-area-inset-top,0px));-webkit-text-size-adjust:100%}
body{margin:0;min-height:100%;background:var(--sand);color:var(--text-on-sand);font-family:var(--sans);font-size:17px;line-height:1.7;-webkit-font-smoothing:antialiased;display:flex;flex-direction:column}
img{display:block;max-width:100%}
a{color:inherit}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--gold);outline-offset:3px}
.wrap{width:min(1280px,100% - 56px);margin-inline:auto}
.narrow{width:min(820px,100% - 48px);margin-inline:auto}
h1,h2,h3{font-family:var(--serif);font-weight:400;margin:0}
[hidden]{display:none!important}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}


/* ---------- Header ---------- */
.nav{position:fixed;top:0;left:0;right:0;z-index:50;padding-top:env(safe-area-inset-top,0px);background:rgba(248,241,230,.97);border-bottom:1px solid rgba(146,118,83,.25)}
.nav .wrap{height:var(--nav-h);display:flex;align-items:center;justify-content:space-between;gap:24px}
.brand{display:inline-flex;align-items:center;gap:2px;text-decoration:none;color:#4b3d2e;line-height:1}
.brand-mark{height:42px;width:auto;margin-right:10px;filter:brightness(0) invert(1);opacity:.92}
.brand .w{font-family:var(--script);font-size:44px;letter-spacing:.02em;color:#4b3d2e}
.brand .s{display:flex;flex-direction:column;line-height:1.25;margin-left:2px;font-size:15px;letter-spacing:.22em;color:var(--gold-soft)}
.brand .s em{font-style:normal;font-size:11px;letter-spacing:.28em;color:var(--muted-on-ink)}
.menu{display:flex;gap:40px;list-style:none;margin:0;padding:0;font-size:15px;letter-spacing:.08em}
.menu a{text-decoration:none;color:#766654;padding:8px 0;border-bottom:1px solid transparent;transition:color .25s,border-color .25s}
.menu a:hover,.menu a[aria-current="page"]{color:#4b3d2e;border-color:var(--gold)}


/* ---------- Jewellery / Clothing the dropdown menus in the nav ----------
   These lists are filled in automatically by renderNavDropdowns() using
   the CATEGORIES object further down, so you only ever need to edit the
   sub-category names in ONE place (the CATEGORIES object). */
.has-dropdown{position:relative}
.dropdown{list-style:none;margin:0;padding:8px 0;position:absolute;top:100%;left:50%;transform:translate(-50%,6px);min-width:200px;background:var(--sand);border:1px solid var(--line);box-shadow:0 16px 34px rgba(30,20,10,.14);opacity:0;visibility:hidden;transition:opacity .18s ease,transform .18s ease,visibility .18s;z-index:60}
.has-dropdown:hover .dropdown,.has-dropdown:focus-within .dropdown{opacity:1;visibility:visible;transform:translate(-50%,0)}
.dropdown li{margin:0}
.dropdown a{display:block;padding:10px 22px;font-size:13px;letter-spacing:.05em;white-space:nowrap;border-bottom:0!important}
.dropdown a:hover{background:var(--sand-2)}
.nav-right{display:flex;align-items:center;gap:22px}
.cart-link{position:relative;display:inline-flex;align-items:center;gap:10px;text-decoration:none;font-size:15px;letter-spacing:.08em;color:#4b3d2e;padding:8px 0}
.cart-link svg{width:24px;height:24px}
.badge{min-width:20px;height:20px;padding:0 6px;border-radius:10px;background:var(--gold);color:var(--ink);font-size:12px;line-height:20px;text-align:center}
.burger{all:unset;display:none;cursor:pointer;width:44px;height:44px;place-items:center}
.burger span,.burger span::before,.burger span::after{display:block;width:24px;height:1.5px;background:#f6efe2;position:relative;content:""}
.burger span::before{position:absolute;top:-7px}.burger span::after{position:absolute;top:7px}
.burger:focus-visible{outline:2px solid var(--gold);outline-offset:2px}

main{flex:1;padding-top:calc(var(--nav-h) + env(safe-area-inset-top,0px))}
main:focus{outline:none}

/* ---------- Buttons ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:12px;font-family:var(--sans);font-size:14px;letter-spacing:.16em;text-decoration:none;padding:17px 34px;border:1px solid var(--gold);color:var(--text-on-ink);background:transparent;cursor:pointer;transition:background .3s,color .3s,border-color .3s;text-align:center}
.on-sand .btn{color:var(--text-on-sand);border-color:var(--gold-deep)}
.btn:hover{background:var(--gold);color:var(--ink);border-color:var(--gold)}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.btn.block{width:100%}
.link{background:none;border:0;padding:0;cursor:pointer;text-decoration:underline;text-underline-offset:4px;color:inherit}

/* ---------- Home hero ---------- */
.hero{display:grid;grid-template-columns:minmax(0,46fr) minmax(0,54fr);min-height:calc(100svh - var(--nav-h))}
.hero-copy{display:flex;flex-direction:column;justify-content:center;padding:clamp(40px,6vw,96px);align-items:flex-start}
.wordmark{font-size:clamp(70px,9.6vw,172px);line-height:.95;letter-spacing:.01em;color:#4b3d2e;white-space:nowrap}
.wordmark.script{font-family:var(--script);font-size:clamp(110px,14vw,240px);line-height:.8}
.lockup{display:flex;align-items:center;gap:18px;margin:34px 0 0;width:min(460px,100%);color:var(--gold)}
.lockup i{flex:1;height:1px;background:currentColor;opacity:.75;transform-origin:left}
.lockup b{width:9px;height:9px;transform:rotate(45deg);border:1px solid currentColor;flex:none}
.hero-sub{font-size:14px;letter-spacing:.32em;color:var(--gold-soft);margin:22px 0 0}
.hero-line{font-family:var(--serif);font-size:clamp(24px,2.4vw,34px);line-height:1.3;max-width:20ch;margin:52px 0 38px;color:var(--text-on-ink)}
.hero-cta{display:flex;flex-wrap:wrap;gap:14px}
.hero-media{position:relative;overflow:hidden;min-height:60vh}
.hero-media img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:50% 62%}
.hero-media::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,rgba(74,59,42,.18),rgba(74,59,42,0) 30%)}
@media (prefers-reduced-motion:no-preference){
  .lockup i{transform:scaleX(0);animation:draw 1.2s .3s cubic-bezier(.2,.7,.2,1) forwards}
  .hero-media img{clip-path:inset(0 0 0 100%);transform:scale(1.06);animation:reveal 1.5s .1s cubic-bezier(.7,0,.2,1) forwards}
  @keyframes draw{to{transform:scaleX(1)}}
  @keyframes reveal{to{clip-path:inset(0);transform:none}}
}

/* ---------- Sand pages ---------- */
.on-sand{background:var(--sand);color:var(--text-on-sand)}
.statement{padding:clamp(80px,12vw,170px) 0}
.statement p{font-family:var(--serif);font-size:clamp(34px,5.2vw,78px);line-height:1.12;margin:0;max-width:17ch}
.statement small{display:block;margin-top:40px;font-size:17px;line-height:1.8;max-width:46ch;color:var(--taupe)}
.trust{background:var(--sand-2);color:var(--text-on-sand);border-block:1px solid var(--line)}
.trust ul{list-style:none;margin:0;padding:26px 0;display:grid;grid-template-columns:repeat(3,1fr);gap:24px;text-align:center;font-size:15px}
.trust strong{display:block;font-family:var(--serif);font-weight:400;font-size:22px;color:var(--text-on-sand)}
.trust span{color:var(--taupe)}

.sec-head{display:flex;justify-content:space-between;align-items:flex-end;gap:24px;border-top:1px solid var(--line);padding-top:28px;margin-bottom:clamp(40px,6vw,80px)}
.sec-head h2{font-size:clamp(38px,5vw,68px);line-height:1}
.sec-head p{margin:0;color:var(--taupe);font-size:16px;max-width:32ch;text-align:right}
.section{padding:clamp(70px,10vw,140px) 0}
.page-head{padding:clamp(50px,7vw,90px) 0 clamp(30px,4vw,50px)}
.page-head h1{font-size:clamp(44px,6.5vw,92px);line-height:1}
.page-head p{margin:18px 0 0;color:var(--taupe);max-width:52ch}
.crumbs{font-size:14px;color:var(--taupe);margin-bottom:26px}
.crumbs a{text-decoration:none;border-bottom:1px solid var(--line)}
.crumbs span{margin:0 8px}
.tabs{display:flex;gap:10px;flex-wrap:wrap;margin:0 0 22px}
.tabs .tab{text-decoration:none;font-size:14px;letter-spacing:.1em;color:var(--taupe);padding:10px 22px;border:1px solid var(--line);transition:all .2s}
.tabs .tab:hover{border-color:var(--gold-deep);color:var(--text-on-sand)}
.tabs .tab.active{background:var(--sand-2);color:var(--sand);border-color:var(--ink)}

/* Sub-category chips (Necklaces / Rings / etc.) shown under the main tabs
   once a department is selected. Generated from CATEGORIES. */
.chips{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 clamp(36px,5vw,54px)}
.chips .chip{text-decoration:none;font-size:12.5px;letter-spacing:.06em;color:var(--taupe);padding:8px 16px;border:1px solid var(--line);border-radius:100px;transition:all .2s}
.chips .chip:hover{border-color:var(--gold-deep);color:var(--text-on-sand)}
.chips .chip.active{background:var(--gold-deep);color:#fff;border-color:var(--gold-deep)}

/* product cards */
.cards{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:34px 26px}
.cards.two{grid-template-columns:repeat(2,minmax(0,1fr))}
.card{display:block;text-decoration:none;color:inherit;position:relative}
.card .ph{position:relative;overflow:hidden;aspect-ratio:3/4;background:var(--sand-2)}
.card.oos .ph img{opacity:.5}
.tag-oos{position:absolute;top:14px;left:14px;z-index:2;background:#5a4936;color:#f8f1e6;font-size:12px;letter-spacing:.14em;padding:7px 13px}
.card img{width:100%;height:100%;object-fit:cover;transition:transform 1.3s cubic-bezier(.2,.7,.2,1)}
.card:hover img{transform:scale(1.04)}
.card .quick{position:absolute;left:0;right:0;bottom:0;padding:14px;text-align:center;background:rgba(74,59,42,.92);color:#4b3d2e;font-size:14px;letter-spacing:.16em;transform:translateY(100%);transition:transform .4s}
.card:hover .quick,.card:focus-visible .quick{transform:none}
.card .meta{display:flex;justify-content:space-between;align-items:baseline;gap:14px;padding-top:18px}
.card h3{font-size:clamp(24px,2vw,30px);line-height:1.15}
.card .price{white-space:nowrap;font-size:16px}
.card p{margin:6px 0 0;font-size:15px;color:var(--taupe);line-height:1.55}
.card .stock,.pdp .stock{display:block;margin-top:8px;font-size:13.5px;letter-spacing:.06em;color:var(--gold-deep)}
.card .stock.oos,.pdp .stock.oos{color:var(--err)}
@media (hover:none){.card .quick{display:none}}

/* detail band */
.detail{position:relative;min-height:80vh;display:flex;align-items:flex-end;overflow:hidden;background:var(--ink)}
.detail img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:60% 40%}
.detail::after{content:"";position:absolute;inset:0;background:linear-gradient(0deg,rgba(74,59,42,.72) 0%,rgba(74,59,42,.35) 32%,rgba(74,59,42,0) 62%)}
.detail .wrap{position:relative;z-index:2;padding-bottom:clamp(50px,7vw,100px)}
.detail h2{font-size:clamp(38px,5.6vw,84px);line-height:1.05;max-width:16ch;color:#4b3d2e}
.detail p{margin:22px 0 0;max-width:44ch;color:var(--text-on-ink)}

/* steps */
.steps{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(4,1fr);gap:28px;counter-reset:s}
.steps li{counter-increment:s;border-top:1px solid var(--gold-deep);padding-top:20px}
.steps li::before{content:counter(s);display:block;font-family:var(--serif);font-size:44px;line-height:1;color:var(--gold-deep);margin-bottom:12px}
.steps h3{font-size:24px;margin-bottom:8px}
.steps p{margin:0;font-size:15.5px;color:var(--taupe);line-height:1.6}

/* ---------- Product page ---------- */
.pdp{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:clamp(30px,5vw,80px);align-items:start;padding-bottom:clamp(60px,8vw,110px)}
.pdp-media{position:sticky;top:calc(var(--nav-h) + 24px)}
.pdp-img{aspect-ratio:3/4;overflow:hidden;background:var(--sand-2)}
.pdp-img.oos img{opacity:.55}
.pdp-img img{width:100%;height:100%;object-fit:cover}
.pdp-gallery{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:8px}
.pdp-gallery img{width:100%;aspect-ratio:3/4;object-fit:cover;background:var(--sand-2)}
.pdp h1{font-size:clamp(40px,4.6vw,66px);line-height:1.02}
.pdp .price{font-size:24px;margin:14px 0 0}
.pdp .short{margin:22px 0 0;color:var(--taupe);max-width:50ch}
.opt{margin-top:32px}
.opt-label{display:flex;justify-content:space-between;align-items:baseline;font-size:15px;margin-bottom:12px}
.sizes{display:flex;flex-wrap:wrap;gap:10px;border:0;padding:0;margin:0}
.sizes label{position:relative}
.sizes input{position:absolute;opacity:0;inset:0;width:100%;height:100%;cursor:pointer;margin:0}
.sizes span{display:grid;place-items:center;min-width:56px;height:48px;padding:0 14px;border:1px solid var(--line);background:var(--field-bg);cursor:pointer;transition:all .2s}
.sizes input:checked + span{background:var(--sand-2);color:var(--sand);border-color:var(--ink)}
.sizes input:focus-visible + span{outline:2px solid var(--gold);outline-offset:3px}
.sizes input:hover + span{border-color:var(--gold-deep)}
.sizes label.unavailable span{opacity:.4;cursor:not-allowed;text-decoration:line-through}
.sizes label.unavailable input{cursor:not-allowed}
.err{color:var(--err);font-size:14.5px;margin:8px 0 0;min-height:0}
.qty{display:inline-flex;align-items:center;border:1px solid var(--line);background:var(--field-bg)}
.qty button{all:unset;cursor:pointer;width:46px;height:46px;display:grid;place-items:center;font-size:22px}
.qty button:hover{background:var(--sand-2)}
.qty button:focus-visible{outline:2px solid var(--gold);outline-offset:-2px}
.qty output{min-width:38px;text-align:center}
.buy{display:grid;gap:12px;margin-top:30px}
.assure{list-style:none;margin:28px 0 0;padding:20px 0 0;border-top:1px solid var(--line);display:grid;gap:8px;font-size:15px;color:var(--taupe)}
.assure li::before{content:"";display:inline-block;width:6px;height:6px;border:1px solid var(--gold-deep);transform:rotate(45deg);margin-right:12px;vertical-align:middle}
details.acc{border-top:1px solid var(--line)}
details.acc:last-of-type{border-bottom:1px solid var(--line)}
details.acc summary{list-style:none;cursor:pointer;display:flex;justify-content:space-between;align-items:center;padding:20px 0;font-family:var(--serif);font-size:24px}
details.acc summary::-webkit-details-marker{display:none}
details.acc summary::after{content:"+";font-family:var(--sans);font-size:24px;color:var(--gold-deep);transition:transform .25s}
details.acc[open] summary::after{transform:rotate(45deg)}
details.acc summary:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
details.acc .body{padding:0 0 22px;color:var(--taupe);font-size:16px}
details.acc .body p{margin:0 0 12px}
details.acc .body ul{margin:0;padding-left:20px}
.accs{margin-top:34px}
table.sz{border-collapse:collapse;width:100%;margin:12px 0;font-size:15px}
table.sz th,table.sz td{border:1px solid var(--line);padding:9px 12px;text-align:left}

/* ---------- Cart ---------- */
.cart-grid{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(300px,1fr);gap:clamp(30px,5vw,70px);align-items:start;padding-bottom:clamp(70px,9vw,120px)}
.line{display:grid;grid-template-columns:110px 1fr auto;gap:22px;padding:24px 0;border-top:1px solid var(--line)}
.line:last-child{border-bottom:1px solid var(--line)}
.line img{width:110px;aspect-ratio:3/4;object-fit:cover}
.line h3{font-size:26px;line-height:1.1}
.line .sub{color:var(--taupe);font-size:15px;margin:6px 0 14px}
.line .rm{font-size:14px;color:var(--taupe)}
.line .tot{text-align:right;white-space:nowrap}
.summary{background:var(--sand-2);padding:30px;border:1px solid var(--line);position:sticky;top:calc(var(--nav-h) + 24px)}
.summary h2{font-size:30px;margin-bottom:18px}
.sum-row{display:flex;justify-content:space-between;gap:16px;padding:8px 0;font-size:16px}
.sum-row.total{border-top:1px solid var(--line);margin-top:10px;padding-top:16px;font-size:20px}
.sum-note{font-size:14.5px;color:var(--taupe);margin:14px 0 20px}
.mini{display:grid;grid-template-columns:60px 1fr auto;gap:14px;align-items:center;padding:8px 0;font-size:15px}
.mini img{width:60px;aspect-ratio:3/4;object-fit:cover}
.mini small{display:block;color:var(--taupe);font-size:13.5px}
.empty{text-align:center;padding:clamp(60px,9vw,120px) 0}
.empty p{color:var(--taupe);margin:14px auto 30px;max-width:40ch}

/* ---------- Forms ---------- */
form fieldset{border:0;padding:0;margin:0 0 42px}
form legend{font-family:var(--serif);font-size:30px;padding:0;margin-bottom:6px}
.hint{color:var(--taupe);font-size:15px;margin:0 0 22px}
.fields{display:grid;grid-template-columns:1fr 1fr;gap:18px 20px}
.f{display:flex;flex-direction:column;gap:7px}
.f.full{grid-column:1 / -1}
.f label{font-size:15px}
.f label i{font-style:normal;color:var(--taupe);font-size:13.5px}
.f input,.f select,.f textarea{font:inherit;font-size:16px;color:var(--text-on-sand);background:var(--field-bg);border:1px solid var(--line);padding:14px 16px;border-radius:0;width:100%;-webkit-appearance:none;appearance:none}
.f select{background-image:linear-gradient(45deg,transparent 50%,currentColor 50%),linear-gradient(135deg,currentColor 50%,transparent 50%);background-position:calc(100% - 22px) 55%,calc(100% - 16px) 55%;background-size:6px 6px;background-repeat:no-repeat;padding-right:42px}
.f select option{color:#231b13;background:#fff}
.f textarea{min-height:100px;resize:vertical}
.f input:focus,.f select:focus,.f textarea:focus{outline:2px solid var(--gold);outline-offset:0;border-color:var(--gold-deep)}
.f [aria-invalid="true"]{border-color:var(--err)}
.f .err{margin:0}
.pay{display:flex;gap:16px;align-items:flex-start;border:1px solid var(--line);background:var(--field-bg);padding:20px;cursor:pointer;margin-bottom:12px}
.pay input{margin-top:6px;accent-color:var(--gold-deep);width:18px;height:18px;flex:none}
.pay strong{display:block;font-family:var(--serif);font-weight:400;font-size:24px;line-height:1.2}
.pay span{color:var(--taupe);font-size:15px}
.pay:has(input:checked){border-color:var(--gold-deep);box-shadow:inset 0 0 0 1px var(--gold-deep)}
.check{display:flex;gap:14px;align-items:flex-start;font-size:15.5px;margin:0 0 10px;cursor:pointer}
.check input{margin-top:5px;accent-color:var(--gold-deep);width:18px;height:18px;flex:none}
.notice{border-left:2px solid var(--gold);background:var(--sand-2);padding:16px 20px;margin:0 0 34px;font-size:15.5px}
.checkout-grid{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(300px,1fr);gap:clamp(30px,5vw,70px);align-items:start;padding-bottom:clamp(70px,9vw,120px)}

/* confirmation / prose */
.done h1{font-size:clamp(40px,5.6vw,80px);line-height:1.05}
.done .lede{color:var(--taupe);margin:18px 0 0;max-width:56ch}

/* ---------- helpers ---------- */
var $=function(s,r){return (r||document).querySelector(s)};

function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]})}
function money(n){return CONFIG.currency+" "+Number(n).toLocaleString("en-US")}
function byId(id){return PRODUCTS.filter(function(p){return p.id===id})[0]}
function inStock(p){return p&&Number(p.stock)>0}
var mem={};
function store(get,key,val){
  try{ if(get) return JSON.parse(localStorage.getItem(key)); localStorage.setItem(key,JSON.stringify(val)); }
  catch(e){ if(get) return mem[key]==null?null:mem[key]; mem[key]=val; }
  return null;
}
function waLink(text){return "https://wa.me/"+CONFIG.whatsapp+(text?"?text="+encodeURIComponent(text):"")}
var hasWA=function(){return /^\d{8,15}$/.test(CONFIG.whatsapp)};

/* ---------- cart ---------- */
var cart=store(true,"shbs_cart")||[];
function saveCart(){store(false,"shbs_cart",cart);updateBadge()}
function updateBadge(){var n=cart.reduce(function(a,l){return a+l.qty},0);var b=$("#badge");b.textContent=n;b.hidden=!n}
function lineTotal(l){return byId(l.id).price*l.qty}
function totals(){
  var sub=cart.reduce(function(a,l){return a+lineTotal(l)},0);
  return {sub:sub,ship:0,total:sub};
}
function addToCart(id,size,qty){
  var f=cart.filter(function(l){return l.id===id&&l.size===size})[0];
  if(f)f.qty=Math.min(10,f.qty+qty);else cart.push({id:id,size:size,qty:qty});
  saveCart();
}

function toast(html){var t=$("#toast");t.innerHTML=html;t.classList.add("show");clearTimeout(toastT);toastT=setTimeout(function(){t.classList.remove("show")},4500)}

/* ---------- Google Sheet sending ---------- */
function sheetOn(){return /^https:\/\/script\.google\.com\/macros\/s\/[^\s]+\/exec$/.test(CONFIG.sheetEndpoint||"")}
function postSheet(payload){
  payload.key=CONFIG.sheetKey||"";
  var ctl=("AbortController" in window)?new AbortController():null,timer;
  var req=fetch(CONFIG.sheetEndpoint,{method:"POST",mode:"no-cors",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify(payload),keepalive:true,signal:ctl?ctl.signal:undefined}).then(function(){return true});
  var to=new Promise(function(res,rej){timer=setTimeout(function(){if(ctl)ctl.abort();rej(new Error("timeout"))},15000)});
  return Promise.race([req,to]).then(function(r){clearTimeout(timer);return r},function(e){clearTimeout(timer);throw e});
}
function sendOrQueue(payload){
  if(!sheetOn())return Promise.resolve(false);
  return postSheet(payload).then(function(){return true}).catch(function(){
    var q=store(true,"shbs_queue")||[];q.push(payload);store(false,"shbs_queue",q);return false;
  });
}
function flushQueue(){
  if(!sheetOn())return;
  var q=store(true,"shbs_queue")||[];if(!q.length)return;
  store(false,"shbs_queue",[]);q.forEach(function(p){sendOrQueue(p)});
}

function setErr(id,msg){var e=$("#e-"+id),f=document.getElementById(id);if(e)e.textContent=msg;if(f)f.setAttribute("aria-invalid",msg?"true":"false")}
function validate(v){
  var er={};
  if(v.fullName.trim().split(/\s+/).filter(Boolean).length<2||v.fullName.trim().length<5) er.fullName="Enter your full name (first and last name).";
  var ph=v.phone.replace(/[\s\-()+]/g,""); if(!/^\d{9,15}$/.test(ph)) er.phone="Enter a valid mobile number with 9 to 15 digits.";
  if(v.whatsapp&&!/^\d{9,15}$/.test(v.whatsapp.replace(/[\s\-()+]/g,""))) er.whatsapp="Enter a valid WhatsApp number or leave it empty.";
  if(!/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(v.email.trim())) er.email="Enter a valid email address.";
  if(!v.emirate) er.emirate="Select your emirate.";
  if(v.area.trim().length<2) er.area="Enter your city or area.";
  if(v.street.trim().length<4) er.street="Enter your street, building name or villa number.";
  if(v.mapLink&&!/^https?:\/\/\S+$/i.test(v.mapLink.trim())) er.mapLink="Enter a full link starting with https://";
  return er;
}

  "Address: "+[o.address.street,o.address.unit,o.address.area,o.address.emirate].filter(Boolean).join(", "),
  o.address.landmark?"Landmark: "+o.address.landmark:"",o.address.mapLink?"Map: "+o.address.mapLink:"",o.address.notes?"Delivery notes: "+o.address.notes:"","",
  "Items:"].concat(o.items.map(function(i){return "- "+i.name+" | size "+i.size+" | qty "+i.qty+" | "+money(i.price*i.qty)}));

  if(o.note)L.push("Note: "+o.note);

}
function submitOrder(e){

    address:{emirate:v.emirate,area:v.area.trim(),street:v.street.trim(),unit:v.unit.trim(),landmark:v.landmark.trim(),mapLink:v.mapLink.trim(),notes:v.deliveryNotes.trim(),country:"United Arab Emirates"},
    items:cart.map(function(l){var p=byId(l.id);return {id:l.id,name:p.name,size:l.size,qty:l.qty,price:p.price}}),totals:t,payment:pm?pm.value:"Cash on delivery",note:v.orderNote.trim(),sent:false};
  var btn=$("#place");btn.disabled=true;btn.textContent="Placing your order…";
  function finish(sent){
    order.sent=sent;

    store(false,"shbs_last",order);

    location.hash="#/confirmation";
  }

    var pl={type:"order",orderId:order.id,date:order.date,name:order.customer.fullName,phone:order.customer.phone,whatsapp:order.customer.whatsapp,email:order.customer.email,
      emirate:order.address.emirate,area:order.address.area,street:order.address.street,unit:order.address.unit,landmark:order.address.landmark,mapLink:order.address.mapLink,deliveryNotes:order.address.notes,

      itemCount:order.items.reduce(function(a,i){return a+i.qty},0),subtotal:order.totals.sub,delivery:order.totals.ship,total:order.totals.total,payment:order.payment,orderNote:order.note};
    sendOrQueue(pl).then(finish);
  } else finish(false);
}

/* ---------- router ---------- */
var current=null;
function route(){
  var h=(location.hash||"#/").replace(/^#\/?/,"");
  var parts=h.split("/"),name=parts[0]||"home",arg=parts[1],arg2=parts[2];
  var fn=pages[name]; if(!fn||name==="notfound"||name==="piece"&&!arg){fn=pages.notfound;name="notfound"}
  var pg=fn(arg,arg2); if(!pg)return;
  var m=$("#main");
  m.innerHTML=pg.html; document.title=pg.title;
  var navKey=name;
  if(name==="piece"){var pr=byId(arg);navKey=pr?pr.category:""}
  else if(name==="collections"){navKey=(arg==="jewellery"||arg==="clothing")?arg:""}
  $$(".menu a").forEach(function(a){var on=a.dataset.nav===navKey;on?a.setAttribute("aria-current","page"):a.removeAttribute("aria-current")});
  window.scrollTo(0,0); $("#toast").classList.remove("show");
  $("#menu").classList.remove("open");$("#burger").setAttribute("aria-expanded","false");
  if(pg.init)pg.init();
  m.setAttribute("tabindex","-1");
}
window.addEventListener("hashchange",route);

/* cart interactions (event delegation) */
$("#main").addEventListener("click",function(e){
  var q=e.target.closest("[data-cq]"),r=e.target.closest("[data-rm]");
  if(q){var l=cart[+q.dataset.cq];l.qty=Math.max(1,Math.min(10,l.qty+Number(q.dataset.d)));saveCart();route()}
  if(r){cart.splice(+r.dataset.rm,1);saveCart();route()}
});
$("#burger").addEventListener("click",function(){var m=$("#menu"),o=m.classList.toggle("open");this.setAttribute("aria-expanded",o);this.setAttribute("aria-label",o?"Close menu":"Open menu")});
document.addEventListener("keydown",function(e){if(e.key==="Escape"){$("#menu").classList.remove("open");$("#burger").setAttribute("aria-expanded","false")}});

/* validate cart against products (in case products changed) */
cart=cart.filter(function(l){return byId(l.id)&&l.qty>0});
renderFooter(); renderNavDropdowns(); updateBadge(); route(); flushQueue();
})();
